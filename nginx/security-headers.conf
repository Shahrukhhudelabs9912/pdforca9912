# Shared security headers — included in every location block that has
# its own add_header directives (nginx suppresses parent-level add_header
# in nested blocks that define their own, so this must be explicit).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# NOTE: Do NOT add 'strict-dynamic' here. It makes the browser IGNORE
# 'unsafe-inline', https:, and host allowlists, permitting ONLY scripts
# carrying a valid nonce/hash. Next.js' inline hydration/bootstrap scripts
# have no nonce in this setup, so 'strict-dynamic' blocks ALL of them →
# no JS runs → tool cards/header go dead (only static links work).
# With 'unsafe-inline' + https: below, inline Next.js scripts and external
# AdSense/GA scripts all load correctly.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: http:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https:; frame-src 'self' https:; object-src 'none'; base-uri 'self';" always;
