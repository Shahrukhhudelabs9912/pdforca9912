x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    <<: *default-logging
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          # In-memory cache — needs almost no CPU. Trimmed 0.5→0.25 to give
          # the backend headroom on the 4-core box (see backend limits).
          memory: 300m
          cpus: "0.25"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    <<: *default-logging
    env_file:
      - ./backend/.env.production
    environment:
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      # Overrides the same keys in .env.production (env_file above) so the
      # concurrency tuning lives in git, not on the server. On a 4-core box,
      # Ghostscript/LibreOffice are single-threaded per job, so 2 workers × 1
      # heavy slot = at most 2 concurrent CPU-bound jobs — leaving 2 cores for
      # the event loops, frontend SSR and nginx. Prevents CPU thrashing that
      # made every job slower when several ran at once.
      WEB_CONCURRENCY: "2"
      HEAVY_JOB_CONCURRENCY: "1"
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          # Backend handles heavy PDF/OCR/LibreOffice conversion. 5 GB is
          # sufficient for most single conversions; the 6→5g reduction
          # leaves critical headroom for the host OS on an 8 GB machine.
          #
          # CPU: with WEB_CONCURRENCY=2 and HEAVY_JOB_CONCURRENCY=1 there are
          # at most 2 concurrent CPU-bound jobs (Ghostscript/LibreOffice are
          # single-threaded per job) → ~2 cores, plus a little for the two
          # event loops. 2.5 fits that without oversubscribing the 4-core box.
          memory: 5g
          cpus: "2.5"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
        NEXT_PUBLIC_ADSENSE_ID: ${NEXT_PUBLIC_ADSENSE_ID}
    restart: unless-stopped
    <<: *default-logging
    environment:
      PYTHON_API_BASE: http://backend:8000/api
      HOSTNAME: "0.0.0.0"
    expose:
      - "3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://localhost:3000',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          # nginx cache (6h + stale-while-revalidate) absorbs the bulk of
          # crawler traffic, so the frontend only handles a few cold SSR
          # renders. 1.5→0.75 CPU still covers 1 render at a time and frees a
          # core for the backend's conversion work on the 4-core box.
          memory: 1g
          cpus: "0.75"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    <<: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/run/nginx.pid && kill -0 $(cat /var/run/nginx.pid)"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          # Light reverse proxy / TLS terminator — trimmed 0.5→0.25 to free
          # CPU for the backend. Plenty for its cache-serving workload.
          memory: 128m
          cpus: "0.25"

  certbot:
    image: certbot/certbot
    profiles: ["certbot"]
    <<: *default-logging
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
